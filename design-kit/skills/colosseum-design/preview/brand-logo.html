<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="caption-hdr">Logo — Colosseum CI</div>
  <div style="padding:20px;background:#fff;border:1px solid #e7eaef;border-radius:8px;display:flex;align-items:center;justify-content:center;">
    <img src="../assets/colosseum-logo.svg" style="height:44px;" alt="Colosseum"/>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12px;color:#464646;">
    <div>
      <div class="caption-hdr" style="font-size:10px;">Size guide</div>
      <div>Favicon: 16/32</div>
      <div>GNB: 32–40</div>
      <div>Footer: 24</div>
      <div>Login: ≤ 120</div>
      <div>Minimum: 24</div>
    </div>
    <div>
      <div class="caption-hdr" style="font-size:10px;">Rules</div>
      <div>✓ Use SVG as-is</div>
      <div>✗ No color/ratio changes</div>
      <div>✗ Never near errors</div>
      <div>✗ Never near competitor logos</div>
    </div>
  </div>
</div>
</body></html>

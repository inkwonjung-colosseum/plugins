<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div>
    <div class="caption-hdr">Accent Colors — Logistics States</div>
    <div class="label" style="margin-top:6px;">Each has Subtle (tinted bg) + Solid (500-ish) pair.</div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;">
    <div>
      <div class="swatch" style="background:#fff0f0;color:#f94949;height:48px;min-height:0;"><div class="name">red 50</div></div>
      <div class="swatch" style="background:#f94949;height:48px;min-height:0;margin-top:4px;"><div class="name">Danger</div><div class="hex">f94949</div></div>
    </div>
    <div>
      <div class="swatch" style="background:#fef3eb;color:#f86702;height:48px;min-height:0;"><div class="name">orange 50</div></div>
      <div class="swatch" style="background:#fea363;height:48px;min-height:0;margin-top:4px;"><div class="name">Negative</div><div class="hex">fea363</div></div>
    </div>
    <div>
      <div class="swatch" style="background:#fff1cc;color:#755400;height:48px;min-height:0;"><div class="name">yellow 100</div></div>
      <div class="swatch" style="background:#ffbb0e;color:#15191f;height:48px;min-height:0;margin-top:4px;"><div class="name">Warning</div><div class="hex">ffbb0e</div></div>
    </div>
    <div>
      <div class="swatch" style="background:#dff7e2;color:#289a3a;height:48px;min-height:0;"><div class="name">green 50</div></div>
      <div class="swatch" style="background:#33c249;height:48px;min-height:0;margin-top:4px;"><div class="name">Safe</div><div class="hex">33c249</div></div>
    </div>
    <div>
      <div class="swatch" style="background:#e5f3ff;color:#1a95ff;height:48px;min-height:0;"><div class="name">sky 50</div></div>
      <div class="swatch" style="background:#1a95ff;height:48px;min-height:0;margin-top:4px;"><div class="name">Positive</div><div class="hex">1a95ff</div></div>
    </div>
    <div>
      <div class="swatch" style="background:#f2f0ff;color:#4724ff;height:48px;min-height:0;"><div class="name">purple 50</div></div>
      <div class="swatch" style="background:#4724ff;height:48px;min-height:0;margin-top:4px;"><div class="name">Stable</div><div class="hex">4724ff</div></div>
    </div>
    <div>
      <div class="swatch" style="background:#ffe6f3;color:#fc038b;height:48px;min-height:0;"><div class="name">pink 50</div></div>
      <div class="swatch" style="background:#fc038b;height:48px;min-height:0;margin-top:4px;"><div class="name">Pink</div><div class="hex">fc038b</div></div>
    </div>
  </div>
</div>
</body></html>

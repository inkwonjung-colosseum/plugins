<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div>
    <div class="caption-hdr">CL Blue — Brand Primary</div>
    <div class="label" style="margin-top:6px;">Primary action, selected states. ⭐ 500 is the brand.</div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(11,1fr);gap:6px;">
    <div class="swatch" style="background:#FAFCFF;color:#3e4a5c;"><div class="name">50</div><div class="hex">FAFCFF</div></div>
    <div class="swatch" style="background:#F2FAFF;color:#3e4a5c;"><div class="name">75</div><div class="hex">F2FAFF</div></div>
    <div class="swatch" style="background:#D6ECFF;color:#3e4a5c;"><div class="name">100</div><div class="hex">D6ECFF</div></div>
    <div class="swatch" style="background:#9CCEFF;color:#15191f;"><div class="name">200</div><div class="hex">9CCEFF</div></div>
    <div class="swatch" style="background:#65ACFE;"><div class="name">300</div><div class="hex">65ACFE</div></div>
    <div class="swatch" style="background:#3287FB;"><div class="name">400</div><div class="hex">3287FB</div></div>
    <div class="swatch" style="background:#005BF6;outline:2px solid #005BF6;outline-offset:2px;"><div class="name">500 ⭐</div><div class="hex">005BF6</div></div>
    <div class="swatch" style="background:#044ECE;"><div class="name">600</div><div class="hex">044ECE</div></div>
    <div class="swatch" style="background:#0742A7;"><div class="name">700</div><div class="hex">0742A7</div></div>
    <div class="swatch" style="background:#00317A;"><div class="name">800</div><div class="hex">00317A</div></div>
    <div class="swatch" style="background:#00204F;"><div class="name">900</div><div class="hex">00204F</div></div>
  </div>
  <div class="caption-hdr" style="margin-top:-4px;">Note: <span style="text-transform:none;color:var(--color-text-data);">75 is a CL-Blue-only extra step.</span></div>
</div>
</body></html>

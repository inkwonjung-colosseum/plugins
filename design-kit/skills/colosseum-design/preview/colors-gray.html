<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div>
    <div class="caption-hdr">Gray — Contrast-Calibrated Neutrals</div>
    <div class="label" style="margin-top:6px;">500 = AA 4.54:1 · 700 = AAA 9.44:1. 200 is the default border.</div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(10,1fr);gap:6px;">
    <div class="swatch" style="background:#F2F2F2;color:#3e4a5c;"><div class="name">50</div><div class="hex">F2F2F2</div></div>
    <div class="swatch" style="background:#DEDEDE;color:#3e4a5c;"><div class="name">100</div><div class="hex">DEDEDE</div></div>
    <div class="swatch" style="background:#CACACA;color:#15191f;"><div class="name">200 ⭐</div><div class="hex">CACACA</div></div>
    <div class="swatch" style="background:#B0B0B0;color:#15191f;"><div class="name">300</div><div class="hex">B0B0B0</div></div>
    <div class="swatch" style="background:#929292;"><div class="name">400</div><div class="hex">929292</div></div>
    <div class="swatch" style="background:#767676;"><div class="name">500 AA</div><div class="hex">767676</div></div>
    <div class="swatch" style="background:#5E5E5E;"><div class="name">600</div><div class="hex">5E5E5E</div></div>
    <div class="swatch" style="background:#464646;"><div class="name">700 AAA</div><div class="hex">464646</div></div>
    <div class="swatch" style="background:#2E2E2E;"><div class="name">800</div><div class="hex">2E2E2E</div></div>
    <div class="swatch" style="background:#1A1A1A;"><div class="name">900</div><div class="hex">1A1A1A</div></div>
  </div>
</div>
</body></html>

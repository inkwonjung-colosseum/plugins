<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="caption-hdr">Button Sizes — SM is default</div>
  <div class="row" style="align-items:flex-end;">
    <div style="text-align:center;">
      <button style="height:24px;padding:0 8px;border-radius:6px;background:#005BF6;color:#fff;border:none;font:700 12px var(--font-sans);">XS</button>
      <div class="mono" style="font-size:10px;color:#767676;margin-top:6px;">24 · 12</div>
    </div>
    <div style="text-align:center;">
      <button style="height:32px;padding:0 12px;border-radius:6px;background:#005BF6;color:#fff;border:none;font:700 14px var(--font-sans);box-shadow:0 0 0 2px rgba(57,195,239,0.7);outline-offset:0;">SM ⭐</button>
      <div class="mono" style="font-size:10px;color:#005BF6;margin-top:6px;">32 · 14 default</div>
    </div>
    <div style="text-align:center;">
      <button style="height:40px;padding:0 16px;border-radius:6px;background:#005BF6;color:#fff;border:none;font:700 14px var(--font-sans);">MD</button>
      <div class="mono" style="font-size:10px;color:#767676;margin-top:6px;">40 · 14</div>
    </div>
    <div style="text-align:center;">
      <button style="height:48px;padding:0 20px;border-radius:6px;background:#005BF6;color:#fff;border:none;font:700 16px var(--font-sans);">LG</button>
      <div class="mono" style="font-size:10px;color:#767676;margin-top:6px;">48 · 16</div>
    </div>
    <div style="text-align:center;">
      <button style="height:56px;padding:0 24px;border-radius:6px;background:#005BF6;color:#fff;border:none;font:700 18px var(--font-sans);">XL Hero</button>
      <div class="mono" style="font-size:10px;color:#767676;margin-top:6px;">56 · 18</div>
    </div>
  </div>
</div>
</body></html>

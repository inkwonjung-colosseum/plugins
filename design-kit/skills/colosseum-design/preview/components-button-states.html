<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="caption-hdr">Button States</div>
  <div class="row">
    <button style="height:32px;padding:0 12px;border-radius:6px;background:#005BF6;color:#fff;border:none;font:700 14px var(--font-sans);">Default</button>
    <button style="height:32px;padding:0 12px;border-radius:6px;background:#044ECE;color:#fff;border:none;font:700 14px var(--font-sans);">Hover</button>
    <button style="height:32px;padding:0 12px;border-radius:6px;background:#0742A7;color:#fff;border:none;font:700 14px var(--font-sans);">Pressed</button>
    <button style="height:32px;padding:0 12px;border-radius:6px;background:#005BF6;color:#fff;border:none;font:700 14px var(--font-sans);outline:2px solid rgba(57,195,239,0.7);outline-offset:2px;">Focus</button>
    <button style="height:32px;padding:0 12px;border-radius:6px;background:#F2F2F2;color:#929292;border:none;font:700 14px var(--font-sans);cursor:not-allowed;">Disabled</button>
  </div>
  <div style="color:#767676;font-size:12px;">Keyboard focus ring: <span class="mono">2px rgba(57,195,239,0.7)</span> + 2px offset. Never on mouse click.</div>
</div>
</body></html>

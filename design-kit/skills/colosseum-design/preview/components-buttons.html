<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="caption-hdr">Buttons — Variants (SM 32px default)</div>
  <div class="row">
    <button style="height:32px;padding:0 12px;border-radius:6px;background:#005BF6;color:#fff;border:none;font:500 14px var(--font-sans);font-weight:700;">저장 Primary</button>
    <button style="height:32px;padding:0 12px;border-radius:6px;background:#fff;border:1px solid #CACACA;color:#464646;font:500 14px var(--font-sans);">Outline</button>
    <button style="height:32px;padding:0 12px;border-radius:6px;background:rgba(0,0,0,0.04);border:none;color:#464646;font:500 14px var(--font-sans);">Secondary</button>
    <button style="height:32px;padding:0 12px;border-radius:6px;background:transparent;border:none;color:#464646;font:500 14px var(--font-sans);">Text</button>
    <button style="height:32px;padding:0 12px;border-radius:6px;background:transparent;border:none;color:#1a95ff;font:500 14px var(--font-sans);">Link</button>
    <button style="height:32px;padding:0 12px;border-radius:6px;background:transparent;border:1px solid #005BF6;color:#464646;font:500 14px var(--font-sans);">Outline-Ghost</button>
    <button style="height:32px;padding:0 12px;border-radius:6px;background:#fff;border:1px solid #f94949;color:#f94949;font:500 14px var(--font-sans);font-weight:700;">삭제 Destructive</button>
  </div>
</div>
</body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="caption-hdr">Cards</div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
    <div style="padding:14px;background:#fff;border:1px solid #CACACA;border-radius:8px;box-shadow:0 1px 3px 0 rgba(0,0,0,0.1),0 1px 2px 0 rgba(0,0,0,0.06);">
      <div style="font-size:13px;font-weight:700;color:#3e4a5c;">주문 #23048</div>
      <div style="font-size:12px;color:#767676;margin-top:6px;">Default card — 8px radius, shadow.base</div>
    </div>
    <div style="padding:14px;background:#e5f3ff;border:1px solid #005BF6;border-radius:8px;">
      <div style="font-size:13px;font-weight:700;color:#3e4a5c;">주문 #23049</div>
      <div style="font-size:12px;color:#767676;margin-top:6px;">Hover — sky.50 bg + primary border</div>
    </div>
    <div style="padding:14px;background:#f6f7f9;border:1px solid #CACACA;border-radius:8px;">
      <div style="font-size:13px;font-weight:700;color:#767676;">주문 #23050</div>
      <div style="font-size:12px;color:#929292;margin-top:6px;">Disabled — natural.50 bg</div>
    </div>
  </div>
</div>
</body></html>

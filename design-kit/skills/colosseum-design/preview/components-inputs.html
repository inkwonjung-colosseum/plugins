<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="caption-hdr">Inputs &amp; Form Controls</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
    <div>
      <label style="display:block;font-size:13px;font-weight:500;color:#3e4a5c;margin-bottom:6px;">이메일</label>
      <input style="width:100%;box-sizing:border-box;height:32px;padding:0 12px;border:1px solid #CACACA;border-radius:4px;font:500 14px var(--font-sans);color:#464646;" placeholder="example@colosseum.com" />
    </div>
    <div>
      <label style="display:block;font-size:13px;font-weight:500;color:#3e4a5c;margin-bottom:6px;">Focus</label>
      <input style="width:100%;box-sizing:border-box;height:32px;padding:0 12px;border:1px solid #005BF6;border-radius:4px;font:500 14px var(--font-sans);color:#464646;box-shadow:0 0 0 2px rgba(57,195,239,0.3);" value="A-02-03" />
    </div>
    <div>
      <label style="display:block;font-size:13px;font-weight:500;color:#3e4a5c;margin-bottom:6px;">Error</label>
      <input style="width:100%;box-sizing:border-box;height:32px;padding:0 12px;border:1px solid #f94949;border-radius:4px;font:500 14px var(--font-sans);color:#464646;" value="invalid@" />
      <div style="font-size:11px;color:#f94949;margin-top:4px;">유효한 이메일을 입력하세요</div>
    </div>
    <div>
      <label style="display:block;font-size:13px;font-weight:500;color:#3e4a5c;margin-bottom:6px;">Disabled</label>
      <input style="width:100%;box-sizing:border-box;height:32px;padding:0 12px;border:1px solid #CACACA;border-radius:4px;font:500 14px var(--font-sans);color:#929292;background:#F2F2F2;cursor:not-allowed;" value="Read-only" disabled />
    </div>
  </div>
</div>
</body></html>

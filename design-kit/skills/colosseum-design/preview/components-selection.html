<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="caption-hdr">Checkbox · Radio · Toggle</div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
    <div>
      <div class="mono" style="font-size:10px;color:#767676;margin-bottom:8px;">CHECKBOX</div>
      <div style="display:flex;gap:8px;">
        <div style="width:20px;height:20px;border:1px solid #CACACA;border-radius:4px;background:#fff;"></div>
        <div style="width:20px;height:20px;border-radius:4px;background:#005BF6;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;">✓</div>
        <div style="width:20px;height:20px;border-radius:4px;background:#c8cfda;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;">✓</div>
      </div>
    </div>
    <div>
      <div class="mono" style="font-size:10px;color:#767676;margin-bottom:8px;">RADIO</div>
      <div style="display:flex;gap:8px;">
        <div style="width:20px;height:20px;border:1px solid #CACACA;border-radius:50%;background:#fff;"></div>
        <div style="width:20px;height:20px;border-radius:50%;background:#005BF6;display:flex;align-items:center;justify-content:center;"><div style="width:8px;height:8px;border-radius:50%;background:#fff;"></div></div>
        <div style="width:20px;height:20px;border:1px solid #CACACA;border-radius:50%;background:#F2F2F2;"></div>
      </div>
    </div>
    <div>
      <div class="mono" style="font-size:10px;color:#767676;margin-bottom:8px;">TOGGLE 44×24</div>
      <div style="display:flex;gap:10px;align-items:center;">
        <div style="width:44px;height:24px;border-radius:12px;background:#F2F2F2;padding:2px;box-sizing:border-box;"><div style="width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.1);"></div></div>
        <div style="width:44px;height:24px;border-radius:12px;background:#005BF6;padding:2px;box-sizing:border-box;display:flex;justify-content:flex-end;"><div style="width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.1);"></div></div>
      </div>
    </div>
  </div>
</div>
</body></html>

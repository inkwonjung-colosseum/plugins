<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="caption-hdr">Toasts — Web (Subtle) vs PDA (Solid, high-contrast)</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
    <div>
      <div class="mono" style="font-size:10px;color:#767676;margin-bottom:6px;">WEB — SUBTLE</div>
      <div style="padding:10px 12px;background:#e5f3ff;border-radius:6px;display:flex;gap:8px;align-items:center;margin-bottom:6px;"><span class="material-symbols-outlined" style="color:#1a95ff;font-size:18px;">info</span><span style="color:#464646;font-size:13px;">저장되었습니다</span></div>
      <div style="padding:10px 12px;background:#dff7e2;border-radius:6px;display:flex;gap:8px;align-items:center;margin-bottom:6px;"><span class="material-symbols-outlined" style="color:#33c249;font-size:18px;">check_circle</span><span style="color:#464646;font-size:13px;">주문 완료</span></div>
      <div style="padding:10px 12px;background:#fff0f0;border-radius:6px;display:flex;gap:8px;align-items:center;"><span class="material-symbols-outlined" style="color:#f94949;font-size:18px;">error</span><span style="color:#464646;font-size:13px;">네트워크 오류</span></div>
    </div>
    <div>
      <div class="mono" style="font-size:10px;color:#767676;margin-bottom:6px;">PDA — SOLID</div>
      <div style="padding:10px 12px;background:#1a95ff;border-radius:6px;display:flex;gap:8px;align-items:center;margin-bottom:6px;"><span class="material-symbols-outlined" style="color:#fff;font-size:18px;">info</span><span style="color:#fff;font-size:13px;font-weight:700;">스캔 완료</span></div>
      <div style="padding:10px 12px;background:#33c249;border-radius:6px;display:flex;gap:8px;align-items:center;margin-bottom:6px;"><span class="material-symbols-outlined" style="color:#fff;font-size:18px;">check_circle</span><span style="color:#fff;font-size:13px;font-weight:700;">피킹 완료</span></div>
      <div style="padding:10px 12px;background:#f94949;border-radius:6px;display:flex;gap:8px;align-items:center;"><span class="material-symbols-outlined" style="color:#fff;font-size:18px;">error</span><span style="color:#fff;font-size:13px;font-weight:700;">스캔 실패 — 재시도</span></div>
    </div>
  </div>
</div>
</body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="background:#F2F2F2;">
  <div class="caption-hdr">Shadows — Elevation</div>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:16px;padding:16px 4px 18px;">
    <div style="height:64px;background:#fff;border-radius:6px;box-shadow:0 1px 2px 0 rgba(0,0,0,0.05);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-family:var(--font-mono);font-size:10px;color:#767676;">sm</div>
    <div style="height:64px;background:#fff;border-radius:6px;box-shadow:0 1px 3px 0 rgba(0,0,0,0.1),0 1px 2px 0 rgba(0,0,0,0.06);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-family:var(--font-mono);font-size:10px;color:#005BF6;">base ⭐ card</div>
    <div style="height:64px;background:#fff;border-radius:6px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1),0 2px 4px -1px rgba(0,0,0,0.06);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-family:var(--font-mono);font-size:10px;color:#767676;">md</div>
    <div style="height:64px;background:#fff;border-radius:6px;box-shadow:0 10px 15px -3px rgba(0,0,0,0.1),0 4px 6px -2px rgba(0,0,0,0.05);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-family:var(--font-mono);font-size:10px;color:#767676;">lg dropdown</div>
    <div style="height:64px;background:#fff;border-radius:6px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-family:var(--font-mono);font-size:10px;color:#767676;">2xl overlay</div>
  </div>
</div>
</body></html>

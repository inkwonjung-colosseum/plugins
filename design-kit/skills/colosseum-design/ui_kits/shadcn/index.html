<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Colosseum × shadcn Components</title>
<link rel="stylesheet" href="../../colors_and_type.css" />
<link rel="stylesheet" href="components.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200" />
<style>
  body { background: #fafafa; padding: 40px 48px 80px; }
  .showcase-nav { position: sticky; top: 16px; float: right; width: 180px; margin-left: 32px; }
  .showcase-nav-inner { background: #fff; border: 1px solid var(--gray-200); border-radius: 8px; padding: 10px; }
  .showcase-nav a { display: block; padding: 5px 8px; font-size: 12px; color: var(--gray-600); text-decoration: none; border-radius: 4px; }
  .showcase-nav a:hover { background: var(--gray-50); color: var(--clblue-500); }
  .page { max-width: 1040px; }
  .page-header { padding-bottom: 32px; border-bottom: 1px solid var(--gray-200); margin-bottom: 40px; }
  .page-header h1 { font-size: 28px; margin: 0 0 6px; }
  .page-header p { color: var(--gray-500); font-size: 14px; }
  .page-header .tagrow { display: flex; gap: 6px; margin-top: 14px; }
  .page-header .tag { font-size: 11px; padding: 3px 8px; background: var(--gray-100); color: var(--gray-600); border-radius: 4px; font-family: var(--font-mono); }
  section { padding: 28px 0; border-bottom: 1px solid var(--gray-100); }
  section > h2 { font-size: 18px; margin: 0 0 4px; color: var(--natural-700); }
  section > .section-sub { color: var(--gray-500); font-size: 13px; margin-bottom: 20px; }
  .example { border: 1px solid var(--gray-200); border-radius: 8px; background: #fff; }
  .example-body { padding: 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .example-body.col { flex-direction: column; }
  .example-label { padding: 8px 16px; border-bottom: 1px solid var(--gray-100); font-size: 11px; color: var(--gray-500); font-family: var(--font-mono); letter-spacing: 0.02em; text-transform: uppercase; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="showcase.jsx"></script>
</body>
</html>

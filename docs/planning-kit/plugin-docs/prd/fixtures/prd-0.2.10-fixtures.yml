  - id: duplicate_decision_board_before_policy
    <<: *parser_boundary_fixture
    input: "정책서 전 metadata 영역에 두 번째 ## 결정 보드가 있는 입력"
    args: ["planning-review", "duplicate-board-before-policy.md"]
    expected_section_order: ["## 결정 보드", "## 결론"]
    expected_boundary_result:
      extracted_policy_contains: ["정상 정책 본문"]
      extracted_policy_absent: ["두 번째 결정 보드 본문"]
      extracted_feature_contains: ["정상 기능설계 본문"]
      extracted_feature_absent: ["두 번째 결정 보드 본문"]
      excluded_ranges:

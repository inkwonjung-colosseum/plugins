    args: ["planning-review", "unclosed-fence.md"]
    expected_section_order: []
    expected_boundary_result:
      extracted_policy_contains: ["정상 정책 본문"]
      extracted_policy_absent: ["오염된 결정 보드 본문"]
      extracted_feature_contains: []
      extracted_feature_absent: ["오염된 결정 보드 본문"]
      excluded_ranges: []
      warnings:
        - "readable projection boundary ambiguous"

  - id: ssot_exclusion
    <<: *decision_board_fixture
    input: "planning/**과 .planning-kit/** 아래 문서가 있는 저장소"
    args: ["planning-review", "policy.md", "feature.md"]
    expected_present:

schema_version: 1
prd: "planning-kit PRD 0.2.10"
purpose: "Golden expectations for the decision-board readable projection, parser boundary handling, release metadata, and documentation artifacts."
status: "spec fixture data; no automated runner is bundled in this repository"

defaults:
  decision_board: &decision_board_fixture
    input: ""
    args: []
    expected_present: []
    expected_absent: []
    expected_scoped_absent:
      decision_board: []
      legacy_summary: []
    expected_scoped_present:
      detail_trace: []
    expected_mapping: {}
    expected_section_order: []
    expected_legacy_summary_rows: []
  parser_boundary: &parser_boundary_fixture
    input: ""
    args: []
    expected_present: []
    expected_absent: []
    expected_scoped_absent:
      decision_board: []
      legacy_summary: []
    expected_scoped_present:
      detail_trace: []
    expected_mapping: {}
    expected_section_order: []
    expected_legacy_summary_rows: []
    expected_boundary_result:
      extracted_policy_contains: []
      extracted_policy_absent: []
      extracted_feature_contains: []
      extracted_feature_absent: []
      excluded_ranges: []
      warnings: []

fixtures:
  - id: zone_planning_format
    <<: *decision_board_fixture
    input: "Zone 관리 planning-format 입력: 등록/수정 메모 필드 정의가 누락된 기획 초안"
    args: ["planning-format", "zone-draft.md"]
    expected_present:
      - "## 결정 보드"
      - "읽는 순서: 오늘 결정 → 릴리즈 차단 확인 → 바로 수정 → 상세 추적"
      - "오늘 결정: D1 메모 필드 등록/수정 허용 여부"
      - "A1 [D1 대기] 메모 입력 항목 정의"
      - "초안 추천(확정 필요)"
    expected_absent:
      - "지금 결정해야 할 항목: 없음"
    expected_mapping:
      D1: ["F5-1"]
      A1: ["D1", "F5-1"]
      T: []
    expected_section_order:
      - "## 결정 보드"
      - "## 정책서"
      - "## 기능설계서"
      - "## 검증 피드백"
      - "## 출처 요약"
      - "## 입력 제외 요약"
    expected_legacy_summary_rows: []

  - id: zone_planning_review
    <<: *decision_board_fixture
    input: "Zone 관리 planning-review 입력: 정책서와 기능설계서 readable projection"
    args: ["planning-review", "policy-url", "feature-url"]
    expected_present:
      - "범례: D=결정, A=문서/구현 작업, R=검토 발견 원본(상세용), T=릴리즈 차단"
      - "읽는 순서: 오늘 결정 → 릴리즈 차단 확인 → 바로 수정 → 상세 추적"
      - "D1 [P0][릴리즈 차단] 외부 시스템 미참조의 정의"
      - "A1 [정책+기능설계][D1 대기][Open] 외부 시스템 미참조 정의 반영"
      - "연결: 관련 발견 2건 (상세 추적의 결정 보드 연결 맵에서 D1로 확인)"
      - "아래 내용은 기존 형식 호환을 위한 요약입니다. 실제 판단과 실행 순서는 위 결정 보드를 기준으로 보세요."
      - "릴리즈 차단: D1 - WCS 플래그 효과 미정으로 자동 전환 QA 불가"
    expected_absent:
      - "지금 결정해야 할 항목: 없음"
      - "테스트 케이스 작성 가능"
    expected_scoped_absent:
      decision_board: ["R2-1", "R3-1"]
      legacy_summary: ["R2-1", "R3-1"]
    expected_scoped_present:
      detail_trace:
        - "결정 보드 연결 맵"
        - "D1 -> R2-1, R3-1"
        - "R2-1 / P0 / 검증가능성 / 외부 시스템 미참조 미정의"
        - "R3-1 / P1 / 영향 분석 / WCS 플래그 연결 계약 부재"
    expected_mapping:
      D1: ["R2-1", "R3-1"]
      A1: ["D1", "R2-1", "R3-1"]
      A2: ["R2-2"]
      A3: ["D2", "R2-3"]
      A4: ["D3", "R2-4"]
      T: []
    expected_section_order:
      - "## 결정 보드"
      - "## 결론"
      - "## 최우선 수정 항목"
      - "## 작업 백로그"
      - "## 발견 요약"
      - "## 검증 범위와 한계"
    expected_legacy_summary_rows:
      - "D1/A1 외부 시스템 미참조 정의"
      - "A2 Zone 간 이동 성공 결과 정의"

  - id: p2_only_review
    <<: *decision_board_fixture
    input: "P2 권고만 있는 planning-review 입력"
    args: ["planning-review", "policy.md", "feature.md"]
    expected_present:
      - "## 결정 보드"
      - "### 지금 결정해야 할 항목\n\n없음"
      - "## 작업 백로그"
      - "## 발견 요약"
    expected_absent:
      - "#### D"
      - "#### T"
    expected_mapping:
      D: []
      T: []
    expected_section_order: ["## 결정 보드", "## 결론", "## 최우선 수정 항목", "## 작업 백로그", "## 발견 요약"]
    expected_legacy_summary_rows:
      - "P2 동기화 권고"

  - id: ssot_only_low_confidence
    <<: *decision_board_fixture
    input: "SSOT 기준 문서 묶음 0건이고 R2/R3 finding이 없는 planning-review 입력"
    args: ["planning-review", "policy.md", "feature.md"]
    expected_present:
      - "판정: 비교 불가"
      - "검증 신뢰도: 낮음"
      - "### 지금 결정해야 할 항목\n\n없음"
      - "SSOT 보강"
    expected_absent:
      - "#### D"
      - "#### T"
    expected_scoped_absent:
      decision_board: ["A1"]
      legacy_summary: []
    expected_mapping:
      D: []
      T: []
    expected_section_order: ["## 결정 보드", "## 결론", "## 최우선 수정 항목", "## 작업 백로그", "## 발견 요약"]
    expected_legacy_summary_rows:
      - "A1 SSOT 기준 문서 묶음 보강"

  - id: axes_ac_review
    <<: *decision_board_fixture
    input: "planning-review --axes ac 입력"
    args: ["planning-review", "--axes", "ac", "policy.md", "feature.md"]
    expected_present:
      - "점검 축: 검증가능성"
    expected_absent:
      - "점검 축: 기준 문서 일치성"
      - "SSOT 보강"
    expected_mapping: {}
    expected_section_order: ["## 결정 보드", "## 결론", "## 최우선 수정 항목", "## 작업 백로그"]
    expected_legacy_summary_rows: []

  - id: release_blocker_item
    <<: *decision_board_fixture
    input: "상태 전이와 외부 인터페이스 TBD가 구현·QA 판정을 막는 입력"
    args: ["planning-format", "blocking-draft.md"]
    expected_present:
      - "릴리즈 차단"
      - "구현/QA 차단"
      - "해소 조건"
    expected_absent:
      - "추적 로그로만 유지"
    expected_mapping:
      D1: ["blocking-input-1"]
      A1: ["D1", "blocking-input-1"]
    expected_section_order: ["## 결정 보드", "## 정책서", "## 기능설계서"]
    expected_legacy_summary_rows: []

  - id: followup_tbd
    <<: *decision_board_fixture
    input: "non-MVP 또는 후속 과제로 명시된 TBD만 있는 입력"
    args: ["planning-format", "followup-draft.md"]
    expected_present:
      - "후속 과제"
    expected_absent:
      - "## 결정 보드"
      - "[릴리즈 차단]"
    expected_mapping: {}
    expected_section_order: ["## 정책서", "## 기능설계서", "## 검증 피드백"]
    expected_legacy_summary_rows: []

  - id: format_no_self_review_blocking_input
    <<: *decision_board_fixture
    input: "planning-format --no-self-review 입력 제외에 원문 정의 부재와 라벨 미매핑이 있는 입력"
    args: ["planning-format", "--no-self-review", "blocking-input.md"]
    expected_present:
      - "## 결정 보드"
      - "원문 정의 부재"
      - "라벨 미매핑"
    expected_absent:
      - "## 검증 피드백"
    expected_mapping:
      A1: ["input-exclusion-1"]
    expected_section_order: ["## 결정 보드", "## 정책서", "## 기능설계서", "## 출처 요약", "## 입력 제외 요약"]
    expected_legacy_summary_rows: []

  - id: format_no_self_review_non_blocking_fetch
    <<: *decision_board_fixture
    input: "planning-format --no-self-review에서 핵심 흐름에 영향 없는 fetch 실패만 있는 입력"
    args: ["planning-format", "--no-self-review", "non-blocking-fetch.md"]
    expected_present:
      - "본문 가져오기 실패"
      - "## 출처 요약"
    expected_absent:
      - "## 결정 보드"
      - "[릴리즈 차단]"
    expected_mapping: {}
    expected_section_order: ["## 정책서", "## 기능설계서", "## 출처 요약", "## 입력 제외 요약"]
    expected_legacy_summary_rows: []

  - id: format_no_self_review_followup_tbd
    <<: *decision_board_fixture
    input: "planning-format --no-self-review에서 후속 과제 TBD만 있는 입력"
    args: ["planning-format", "--no-self-review", "followup-tbd.md"]
    expected_present:
      - "후속 과제"
    expected_absent:
      - "## 결정 보드"
    expected_mapping: {}
    expected_section_order: ["## 정책서", "## 기능설계서", "## 출처 요약", "## 입력 제외 요약"]
    expected_legacy_summary_rows: []

  - id: exclusion_grading
    <<: *decision_board_fixture
    input: "fetch 실패, 원문 정의 부재, 라벨 미매핑이 섞인 입력 제외 요약"
    args: ["planning-format", "mixed-exclusions.md"]
    expected_present:
      - "릴리즈 차단"
      - "결정 필요"
      - "후속 과제"
      - "추적 로그"
    expected_absent: []
    expected_mapping:
      A1: ["input-exclusion-blocker"]
    expected_section_order: ["## 결정 보드", "## 정책서", "## 기능설계서", "## 입력 제외 요약"]
    expected_legacy_summary_rows: []

  - id: verification_sentence
    <<: *decision_board_fixture
    input: "P0/P1 finding에 관찰 가능한 검증 방법을 만들 수 있는 review 입력"
    args: ["planning-review", "policy.md", "feature.md"]
    expected_present:
      - "Given "
      - "When "
      - "Then "
    expected_absent:
      - "테스트 작성 가능"
    expected_mapping:
      A1: ["R2-1"]
    expected_section_order: ["## 결정 보드", "## 결론", "## 작업 백로그"]
    expected_legacy_summary_rows:
      - "A1"

  - id: verification_sentence_failure
    <<: *decision_board_fixture
    input: "검증 방법이 가능성 문장만 포함된 실패 케이스"
    args: ["planning-review", "policy.md", "feature.md"]
    expected_present:
      - "구현/QA 차단"
    expected_absent:
      - "검증 방법: 테스트 작성 가능"
    expected_mapping:
      A1: ["R2-1"]
    expected_section_order: ["## 결정 보드", "## 결론", "## 작업 백로그"]
    expected_legacy_summary_rows:
      - "A1"

  - id: verification_sentence_unavailable
    <<: *decision_board_fixture
    input: "관찰 가능한 신호가 부족해 검증 문장을 만들 수 없는 P0/P1 finding"
    args: ["planning-review", "policy.md", "feature.md"]
    expected_present:
      - "구현/QA 차단"
      - "관찰 가능한 신호 부족"
    expected_absent:
      - "테스트 케이스 작성 가능"
    expected_mapping:
      A1: ["R2-1"]
    expected_section_order: ["## 결정 보드", "## 결론", "## 작업 백로그"]
    expected_legacy_summary_rows:
      - "A1"

  - id: card_display
    <<: *decision_board_fixture
    input: "5열 초과 또는 표시 문자열 60자 초과 결정 보드"
    args: ["planning-review", "wide-table-policy.md", "wide-table-feature.md"]
    expected_present:
      - "결정 질문:"
      - "완료 조건:"
      - "담당/결정 필요자:"
    expected_absent:
      - "| ID | 연결 | 유형 | 의존성 | 대상 | 작업 | 완료 조건 | 검증 방법 | 담당/결정 필요자 | 상태 |"
    expected_mapping:
      A1: ["R2-1"]
    expected_section_order: ["## 결정 보드", "## 결론"]
    expected_legacy_summary_rows:
      - "A1"

  - id: mobile_card_display
    <<: *decision_board_fixture
    input: "모바일 폭에서 결정 보드를 카드/필드 목록으로 표시하는 review 입력"
    args: ["planning-review", "--viewport", "mobile", "policy.md", "feature.md"]
    expected_present:
      - "결정 질문:"
      - "검증 방법:"
    expected_absent:
      - "가로 스크롤 필요"
    expected_mapping:
      D1: ["R2-1"]
      A1: ["D1", "R2-1"]
    expected_section_order: ["## 결정 보드", "## 결론"]
    expected_legacy_summary_rows:
      - "A1"


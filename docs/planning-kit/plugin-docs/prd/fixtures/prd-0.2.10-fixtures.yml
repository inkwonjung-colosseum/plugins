    args: ["planning-review", "legacy-0.2.9-output.md"]
    expected_present:
      - "## 결정 보드"
      - "## 결론"
    expected_absent:
      - "readable projection boundary ambiguous"
    expected_mapping: {}
    expected_section_order: ["## 결정 보드", "## 결론", "## 최우선 수정 항목", "## 작업 백로그"]
    expected_legacy_summary_rows: []

  - id: fenced_code_input
    <<: *parser_boundary_fixture
    input: "정책서 code fence 안에 ## 결정 보드 문자열이 있는 입력"
    args: ["planning-review", "fenced-code.md"]
    expected_section_order: ["## 결정 보드", "## 결론"]
    expected_boundary_result:
      extracted_policy_contains: ["```", "## 결정 보드"]
      extracted_policy_absent: []
      extracted_feature_contains: ["정상 기능설계 본문"]
      extracted_feature_absent: []
      excluded_ranges: []
      warnings: []

  - id: blockquote_heading_input
    <<: *parser_boundary_fixture
    input: "blockquote 안에 > ## 결정 보드 문자열이 있는 입력"
    args: ["planning-review", "blockquote-heading.md"]
    expected_section_order: ["## 결정 보드", "## 결론"]
    expected_boundary_result:
      extracted_policy_contains: ["> ## 결정 보드"]
      extracted_policy_absent: []
      extracted_feature_contains: ["정상 기능설계 본문"]
      extracted_feature_absent: []
      excluded_ranges: []
      warnings: []

  - id: list_child_heading_input
    <<: *parser_boundary_fixture
    input: "리스트 하위에 - ## 결정 보드 문자열이 있는 입력"
    args: ["planning-review", "list-child-heading.md"]
    expected_section_order: ["## 결정 보드", "## 결론"]
    expected_boundary_result:

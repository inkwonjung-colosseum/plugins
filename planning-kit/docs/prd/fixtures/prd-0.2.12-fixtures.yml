schema_version: 1
prd: "planning-kit PRD 0.2.12"
purpose: "Golden expectations for result-summary-first planning-format output, decision-board-first planning-review output, readable projection parser boundaries, and release document hygiene."
status: "spec fixture data; no automated runner is bundled in this repository"

defaults:
  common: &common
    args: []
    inline_input: ""
    expected_section_order: []
    expected_present: []
    expected_absent: []
    expected_scoped_absent: {}
    expected_saved_file_absent: []
    line_budget: {}

fixtures:
  - id: result_summary_exact_fields
    <<: *common
    args: ["planning-format", "zone-draft.md"]
    inline_input: "planning-format output with self-review findings and one source failure"
    expected_section_order:
      - "# Zone 관리"
      - "## 생성 결과 요약"
      - "## 결정 보드"
      - "## 정책서"
      - "## 기능설계서"
      - "## 검증 피드백"
    expected_present:
      - "## 생성 결과 요약"
      - "- 문서 결과:"
      - "- 저장:"
      - "- 검증 상태:"
      - "- 확인 필요:"
      - "- 출처 상태:"
      - "- 입력 제외 상태:"
      - "- 읽는 순서:"
    expected_absent:
      - "## 정책서\n\n## 생성 결과 요약"
    line_budget:
      "## 생성 결과 요약": 7

  - id: result_summary_no_feedback
    <<: *common
    args: ["planning-format", "clean-draft.md"]
    inline_input: "planning-format output with no self-review feedback and no decision board"
    expected_section_order:
      - "# 주문 취소"
      - "## 생성 결과 요약"
      - "## 정책서"
      - "## 기능설계서"
      - "## 검증 피드백"
    expected_present:
      - "- 검증 상태: 피드백 없음"
      - "- 확인 필요: 없음"
      - "## 검증 피드백\n\n없음"
    expected_absent:
      - "## 결정 보드"

  - id: feedback_card_display_long_cells
    <<: *common
    args: ["planning-format", "figma-flow-draft.md"]
    inline_input: "self-review produces long feedback cells that must render as cards"
    expected_section_order:
      - "## 검증 피드백"
      - "## 출처 요약"
    expected_present:
      - "### 피드백 1 (F5-1)"
      - "- 위치:"
      - "- 구분:"
      - "- 문제:"
      - "- 영향:"
      - "- 제안:"
      - "- 사용자 확인:"
      - "- 본문 반영 여부:"
      - "- 결정 보드 연결:"
    expected_absent:
      - "| ID | 구분 | 위치 | 문제 | 영향 | 제안 | 사용자 확인 |"
    expected_scoped_absent:
      "## 검증 피드백":
        - "|---|---|---|---|---|---|---|"

  - id: save_canonical_no_result_summary
    <<: *common
    args: ["planning-format", "zone-draft.md", "--save"]
    inline_input: "screen output contains metadata; saved files remain canonical policy/feature markdown"
    expected_present:
      - "## 생성 결과 요약"
      - "## 결정 보드"
      - "- 저장: planning/"
    expected_saved_file_absent:
      - "## 생성 결과 요약"
      - "## 결정 보드"
      - "## 검증 피드백"
      - "## 출처 요약"
      - "## 입력 제외 요약"
      - "## 상세 추적"

  - id: parser_ignores_result_summary
    <<: *common
    args: ["planning-review"]
    inline_input: |
      # Zone 관리

      ## 생성 결과 요약

      - 문서 결과: 정책서와 기능설계서 생성 완료
      - 확인 필요: 없음
      - 출처 상태: 아래 가짜 heading은 요약 문장입니다

      ```markdown
      ## 정책서
      이 문장은 본문이 아닙니다.
      ```

      ## 정책서

      실제 정책 본문

      ## 기능설계서

      실제 기능 본문
    expected_present:
      - "readable projection accepted"
    expected_absent:
      - "이 문장은 본문이 아닙니다."
    expected_scoped_absent:
      extracted_policy:
        - "이 문장은 본문이 아닙니다."

  - id: legacy_sections_old_order
    <<: *common
    args: ["planning-review"]
    inline_input: "0.2.10/0.2.11 review report order: 결정 보드, 결론, 최우선 수정 항목, 작업 백로그, 발견 요약"
    expected_section_order:
      - "## 결정 보드"
      - "## 결론"
      - "## 최우선 수정 항목"
      - "## 작업 백로그"
      - "## 발견 요약"
    expected_present:
      - "legacy readable projection accepted"
      - "same ID resolved from decision board first"

  - id: legacy_sections_new_order
    <<: *common
    args: ["planning-review"]
    inline_input: "0.2.12 review report order: 결정 보드, 결론, 발견 요약, 검증 범위와 한계, 출처 요약, 최우선 수정 항목, 작업 백로그"
    expected_section_order:
      - "## 결정 보드"
      - "## 결론"
      - "## 발견 요약"
      - "## 검증 범위와 한계"
      - "## 출처 요약"
      - "## 최우선 수정 항목"
      - "## 작업 백로그"
      - "## 상세 추적"
    expected_present:
      - "요약: 실제 우선순위와 실행 순서는 위 결정 보드를 기준으로 확인하세요."

  - id: id_label_normalization
    <<: *common
    args: ["planning-review"]
    inline_input: "legacy IDs and natural labels appear together"
    expected_present:
      - "결정 1 (D1)"
      - "작업 1 (A1)"
      - "출시 전 해결 1 (T1)"
      - "차단 (P0)"
    expected_absent:
      - "- D1 "
      - "- A1 "
      - "- P0 "
    expected_scoped_absent:
      "## 결정 보드":
        - "\n- D1"
        - "\n- A1"
        - "\n- P0"

  - id: detail_trace_reordered
    <<: *common
    args: ["planning-review", "policy.md", "feature.md"]
    inline_input: "review output with decision board mapping, raw findings, and source tables"
    expected_section_order:
      - "## 상세 추적"
      - "### 결정 보드 연결 맵"
      - "### SSOT 충돌"
      - "### 입력 출처"
      - "### 기준 문서 출처"
    expected_present:
      - "### 결정 보드 연결 맵"
      - "D1 -> R2-1, R3-1"

  - id: review_legacy_sections_minimized
    <<: *common
    args: ["planning-review", "policy.md", "feature.md"]
    inline_input: "review output with decision board and compatibility headings"
    expected_present:
      - "요약: 실제 우선순위와 실행 순서는 위 결정 보드를 기준으로 확인하세요."
      - "작업 1 (A1) - 결정 보드 참조"
    expected_scoped_absent:
      "## 최우선 수정 항목":
        - "선택지:"
        - "검증 방법:"
        - "완료 조건:"
        - "Given "
        - "When "
        - "Then "
        - "R2-1"
      "## 작업 백로그":
        - "선택지:"
        - "검증 방법:"
        - "완료 조건:"
        - "Given "
        - "When "
        - "Then "
        - "R3-1"
    line_budget:
      "## 최우선 수정 항목": 5
      "## 작업 백로그": 5

  - id: review_ssot_missing_axes_matrix
    <<: *common
    args: ["planning-review", "policy.md", "feature.md"]
    inline_input: "matrix: all axes with no 기준 문서, --axes ac, and 기준 문서 본문 없음"
    expected_present:
      - "비교 근거 부족"
      - "판정: 비교 불가"
      - "검증 신뢰도: 낮음"
      - "기준 문서 묶음 0건"
      - "--axes ac 호출에서는 SSOT 보강 작업 없음"
      - "모두 본문 없는 문서"
    expected_absent:
      - "충돌 없음"
    expected_scoped_absent:
      "## 결정 보드":
        - "SSOT 보강"
      "--axes ac":
        - "SSOT 보강"

  - id: review_final_clean_display_regression
    <<: *common
    args: ["planning-review", "zone-policy-url", "zone-feature-url"]
    inline_input: "Zone 관리 review output that previously leaked section signs and internal terms from legacy/reference context"
    expected_present:
      - "정책서 6, 9 / 기능설계서 5"
      - "정책서 8"
      - "기능설계서 5.2~5.4"
      - "출시 전 해결 필요"
      - "기준 문서 묶음"
      - "본문 없는 문서"
      - "기준 문서 출처"
    expected_absent:
      - "정책서 §6"
      - "정책서 §8"
      - "기능설계서 §5"
      - "§10 참조"
      - "릴리즈 차단"
      - "SSOT corpus"
      - "SSOT token"
      - "SSOT 출처"
      - "SSOT Markdown"
      - "placeholder"
      - "fetch"
      - "connector fallback"
      - "raw markdown"
    expected_scoped_absent:
      "## 결정 보드":
        - "§"
        - "릴리즈 차단"
        - "오늘 결정: D1"
        - "바로 수정: A1"
      "## 검증 범위와 한계":
        - "SSOT corpus"
        - "SSOT token"
        - "placeholder"
      "## 상세 추적":
        - "§"
        - "SSOT 출처"
        - "SSOT Markdown"
        - "placeholder"

  - id: doc_hygiene_clean_display
    <<: *common
    args: ["doc-hygiene", "planning-kit/README.md", "planning-kit/docs/planning-format-workflow.md", "planning-kit/docs/planning-review-workflow.md", "planning-kit/docs/planning-kit-workflow-guide.md"]
    inline_input: "documentation examples must use clean display and natural first-screen labels"
    expected_present:
      - "## 생성 결과 요약"
      - "결정 1 (D1)"
      - "작업 1 (A1)"
      - "출시 전 해결 1 (T1)"
      - "기준 문서 묶음"
    expected_absent:
      - "오늘 결정: D1"
      - "바로 수정: A1"
      - "릴리즈 차단: D1"
    expected_scoped_absent:
      final_output_examples:
        - "§"
        - "\n- D1"
        - "\n- A1"
        - "\n- P0"
        - "SSOT corpus"
        - "raw markdown"
        - "fetch"
        - "connector fallback"

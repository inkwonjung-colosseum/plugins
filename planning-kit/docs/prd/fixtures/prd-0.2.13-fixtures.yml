schema_version: 1
prd: "planning-kit PRD 0.2.13"
purpose: "Golden expectations for planning-publish-confluence context-memory-only publishing, v0.7 Confluence title labels, pre-confirm no-write safety, duplicate handling, readback, and partial failure."
status: "spec fixture data plus automated mock dry-run release gates in planning-kit/tests/test_0_2_13_publish_dry_run.py"

defaults:
  publish: &publish_fixture
    args: ["planning-publish-confluence"]
    inline_context: ""
    expected_present: []
    expected_absent: []
    expected_no_tool_calls: []
    expected_tool_calls: []
    expected_section_order: []

fixtures:
  - id: forbidden_path_input_no_io
    <<: *publish_fixture
    args: ["planning-publish-confluence", "./planning/Zone--2026-05-12-120000/"]
    inline_context: "Current context has no publishable body."
    expected_present:
      - "발행 취소"
      - "0.2.13은 현재 context memory 안의 정책서·기능 설계서만 발행 대상으로 사용합니다"
      - "Confluence 변경: 없음"
    expected_no_tool_calls:
      - "local_file_read"
      - "url_fetch"
      - "connector_fallback"
      - "confluence_get_page"
      - "ask_user_question"

  - id: forbidden_url_input_no_fetch
    <<: *publish_fixture
    args: ["planning-publish-confluence", "https://colosseum.atlassian.net/wiki/spaces/PROD/pages/1/example"]
    expected_present:
      - "발행 취소"
      - "파일 경로, URL, 저장 산출물 경로, 옵션 인자는 지원하지 않습니다."
    expected_no_tool_calls:
      - "url_fetch"
      - "confluence_get_page"
      - "confluence_create_page"

  - id: context_memory_two_bodies_publishable
    <<: *publish_fixture
    inline_context: |
      ## 정책서

      ### 목적
      Zone 이동 정책을 정의한다.

      ### 세부 규칙
      HOLD 재고는 승인 후 이동한다.

      ## 기능 설계서

      ### 사용자 흐름
      운영자가 Zone 이동을 요청한다.

      ### 예외와 메시지
      승인 전 이동은 차단한다.
    expected_present:
      - "Confluence 발행 위치를 선택하세요."
      - "[기능명] v0.7"
      - "[기능명] 정책서 v0.7"
      - "[기능명] 기능 설계서 v0.7"
    expected_no_tool_calls:
      - "local_file_read"
      - "url_fetch"

  - id: context_memory_duplicate_candidates_cancel
    <<: *publish_fixture
    inline_context: |
      ## 정책서
      ### A
      본문 A.
      ### B
      본문 B.

      ## 정책서
      ### C
      본문 C.
      ### D
      본문 D.

      ## 기능 설계서
      ### A
      본문 A.
      ### B
      본문 B.
    expected_present:
      - "발행 취소"
      - "candidate가 2개 이상"
    expected_no_tool_calls:
      - "confluence_get_page"
      - "confluence_create_page"

  - id: default_parent_permission_preflight
    <<: *publish_fixture
    inline_context: "publishable policy + feature bodies already in context"
    expected_tool_calls:
      - "confluence_get_page"
      - "confluence_check_create_child_permission"
    expected_present:
      - "https://colosseum.atlassian.net/wiki/spaces/PROD/pages/1767604270/SSOT"
      - "page title"
      - "page id"
      - "current version"
      - "ancestor path"
    expected_no_tool_calls:
      - "confluence_create_page"
      - "confluence_update_page"

  - id: duplicate_unversioned_title_no_update
    <<: *publish_fixture
    inline_context: "publishable policy + feature bodies already in context"
    expected_present:
      - "legacy flat-child collision"
      - "v0.7 없는 unversioned page를 업데이트하지 않는다"
      - "새 title suffix 생성 또는 취소"
    expected_absent:
      - "기존 페이지 업데이트"

  - id: no_write_before_final_confirm
    <<: *publish_fixture
    inline_context: "publishable policy + feature bodies already in context"
    expected_present:
      - "발행 진행"
      - "취소"
      - "발행 label: v0.7"
      - "page move 없음"
    expected_no_tool_calls:
      - "confluence_create_page"
      - "confluence_update_page"

  - id: readback_fingerprint_mismatch_partial
    <<: *publish_fixture
    inline_context: "publishable policy + feature bodies already in context; final confirmation accepted"
    expected_tool_calls:
      - "confluence_create_page"
      - "confluence_get_page"
    expected_present:
      - "부분 완료"
      - "content fingerprint mismatch"
      - "남은 write: 실행하지 않음"
      - "성공 page URL"

  - id: v07_title_label_required
    <<: *publish_fixture
    inline_context: "publishable policy + feature bodies already in context"
    expected_present:
      - "[기능명] v0.7"
      - "[기능명] 정책서 v0.7"
      - "[기능명] 기능 설계서 v0.7"
      - "발행 label: v0.7"
      - "문서 상태: SSOT 후보"
    expected_absent:
      - "[기능명] 정책서 |"
      - "[기능명] 기능 설계서 |"

  - id: update_version_conflict_cancel
    <<: *publish_fixture
    inline_context: "publishable policy + feature bodies already in context; existing v0.7 page selected for update"
    expected_present:
      - "version conflict"
      - "발행 취소"
      - "Confluence 변경: 없음"
    expected_no_tool_calls:
      - "confluence_update_page"

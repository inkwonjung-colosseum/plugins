interface:
  display_name: plan-draft
  short_description: 핵심 모호함을 질문으로 해소하거나 명시해 plan-format 전 기획초안을 만듭니다
  brand_color: "#0F766E"
  default_prompt: 기획 인터뷰로 핵심 모호함을 정리해서 기획초안 만들어줘
policy:
  allow_implicit_invocation: true
  implicit_invocation:
    use_when:
      - 질문하면서 기획을 잡거나 핵심 모호함을 해소해야 할 때
      - 기능 방향, 문제, 사용자, 범위, 정책 조건을 대화로 정리해야 할 때
      - plan-format 저장 보류 후 부족 항목을 보완해야 할 때
    avoid_when:
      - 충분한 기획 입력을 기능설계서와 정책서로 바로 정리하려는 경우에는 plan-format을 사용
      - 기존 기능설계서/정책서 초안을 검토하거나 pass 판단하려는 경우에는 plan-review를 사용
    sequencing:
      - 사용자 출력은 output-contract.md 기준을 따른다.
      - Codex에서 질문 도구가 없지만 현재 대화가 이어질 수 있으면 일반 대화 fallback으로 질문하고, 비대화형 실행에서만 질문 필요로 저장 보류를 반환한다.
      - plan-format 저장 보류에서 온 입력은 rerun-contract.md 기준으로 재실행 맥락을 보존한다.
      - plan-format이 사용자 결정 필요로 종료한 뒤에는 사용자가 명시적으로 새 기획 인터뷰를 요청한 경우에만 plan-draft를 다시 사용한다.

interface:
  display_name: plan-format
  short_description: 기획 입력의 변환 가능성을 판정하고 기능설계서와 정책서 로컬 초안을 생성합니다
  brand_color: "#0F766E"
  default_prompt: 기획 내용을 기능설계서와 정책서로 정리해줘
policy:
  allow_implicit_invocation: true
  implicit_invocation:
    canonical_source: ../SKILL.md
    use_when:
      - 기획 노트, 회의록, AI 대화 결과물을 기능설계서와 정책서로 정리해야 할 때
      - 기획자료 디렉터리 텍스트 파일을 통합해 기능설계서와 정책서로 정리해야 할 때
      - 저장 보류 후 부족 항목을 보강한 입력을 다시 정리해야 할 때
    avoid_when:
      - 기존 초안 검토/pass 판단은 plan-review 사용
      - 단순 질의응답이나 아이디어 탐색만 원하는 경우는 일반 답변
    sequencing:
      - "진행 표시는 SKILL.md '### 진행 표시 원칙'을 따른다. 각 step 진입 시 `Step N: <이름>` 헤더 한 줄만 출력하고 sub-action narration·본문 echo·file IO 안내 금지."
      - "Step 1: 설정 확인 — .product-team-kit/config.json 없음/파싱 실패/version 미일치/outputRoot 거부 시 즉시 `Step 2: 종료 출력`로 분기 단축. 세부는 SKILL.md '## 1. 설정 확인' 참조."
      - "Step 2: gate 판정 — 변환 가능 판정 전 파일 생성 금지. 미통과 시 `Step 3: 종료 출력`로 분기 단축. 세부는 SKILL.md '## 2. Gate First 변환 가능 판정' 참조."
      - "Step 3: dispatch — 라벨 매핑·용어 사전·안전기능명 결정만. 본문 작성 금지."
      - "Step 4: 두 문서 작성·검증 — main이 두 문서 본문을 같은 턴에 직접 작성하고 검증. 기능설계서/정책서 worker로 분리하지 않는다. 기능설계서 섹션 1~8(8=미결 사항)·정책서 섹션 1~10(10=미결 사항) 헤더와 admonition metadata는 템플릿과 1:1로 유지한다. 빈 위치 보존 원칙: admonition 줄·표 row·표 셀은 삭제 금지, 입력 근거 없으면 marker(`[미정]`/`[확인 필요]`) 또는 `해당 없음` fill 문구로 채운다. 섹션 6 이상은 근거 전무 시 row 1 항목·설명 셀에 대표 fill 후 나머지 셀도 `해당 없음` (인덱스 컬럼은 템플릿 값 유지). 미결 사항 표는 marker 0건이어도 row 1 항목·설명 셀을 `해당 없음`으로 채워 유지 (인덱스 컬럼은 `1` 유지). dispatch `용어 사전`은 정책서 §3 용어 정의에만. 표는 컬럼명·컬럼 순서·컬럼 수를 템플릿과 동일하게 유지한다. main은 구조 일치(섹션·admonition metadata)·표 컬럼 일치·빈 골격·중복 항목·라벨 cross-bleed·marker 합산을 검증한다. 중복과 cross-bleed는 전체 재작성 없이 위반 문장·행·셀만 국소 repair한다. 검증 실패 시 `Step 5: 보류 출력`로 분기 단축."
      - "Step 5: 저장 절차 — main 검증 통과 후에만 진입. staging folder → 두 파일 병렬 write → verify → rename → verify. 저장 경로는 references/storage-contract.md, 분류·marker는 SKILL.md를 단일 소스로 따른다."
      - "Step 6: 종료 출력 — references/output-contract.md의 분기별 템플릿(설정 없음 / 저장 보류 / 저장 완료 / 저장 실패) 1회 출력."
      - "Python·Node.js·CLI helper 설치를 전제하지 않는다."

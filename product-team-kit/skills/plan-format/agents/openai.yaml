interface:
  display_name: plan-format
  short_description: 기획 입력을 기능설계서와 정책서 로컬 초안으로 동시에 정리합니다
  brand_color: "#0F766E"
  default_prompt: 기획 내용을 기능설계서와 정책서로 정리해줘
policy:
  allow_implicit_invocation: true
  implicit_invocation:
    use_when:
      - 기획 노트, 회의록, AI 대화 결과물을 기능설계서와 정책서로 정리해야 할 때
      - plan-draft 산출 기획초안을 기능설계서/정책서 초안으로 변환해야 할 때
      - 충분한 제품·업무 판단 정보가 있는 입력을 템플릿에 맞춰 구조화해야 할 때
    avoid_when:
      - 질문하면서 기획 방향을 잡거나 부족 항목을 보완해야 하는 경우에는 plan-draft를 사용
      - 기존 초안을 발행 전 검토하거나 pass 판단하려는 경우에는 plan-review를 사용
    sequencing:
      - 생성과 검토를 함께 요청하면 먼저 plan-format으로 초안을 저장하고, 저장 성공 후 plan-review를 안내한다.
      - 저장된 기능설계서와 정책서는 로컬 초안 템플릿이며 공식 팀 문서가 아니다.
      - 사용자가 명시적으로 바로 검토까지 요청한 경우에만 저장 경로를 대상으로 plan-review를 이어서 수행한다.
      - 사용자 출력은 output-contract.md 기준을 따르고 문서 분류는 classification-contract.md 기준을 따른다.
      - 일반 입력이 부족하면 rerun-contract.md 기준으로 plan-draft 보완을 1회 안내한다.
      - plan-draft 산출 기획초안 입력도 부족하면 사용자 결정 필요로 종료하고 자동 재질문 또는 자동 plan-draft 재라우팅을 하지 않는다.

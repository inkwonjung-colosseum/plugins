interface:
  display_name: plan-format
  short_description: 기획 입력의 변환 가능성을 판정하고 기능설계서와 정책서 로컬 초안을 생성합니다
  brand_color: "#0F766E"
  default_prompt: 기획 내용을 기능설계서와 정책서로 정리해줘
policy:
  allow_implicit_invocation: true
  implicit_invocation:
    use_when:
      - 기획 노트, 회의록, AI 대화 결과물을 기능설계서와 정책서로 정리해야 할 때
      - 기획자료 디렉터리의 읽을 수 있는 텍스트 파일을 통합해 기능설계서와 정책서로 정리해야 할 때
      - 충분한 제품·업무 판단 정보가 있는 입력을 템플릿에 맞춰 구조화해야 할 때
      - 저장 보류 후 부족 항목을 보강한 입력을 기능설계서와 정책서로 다시 정리해야 할 때
    avoid_when:
      - 기존 초안을 발행 전 검토하거나 pass 판단하려는 경우에는 plan-review를 사용
      - 기능설계서/정책서 생성 없이 단순 질의응답이나 아이디어 탐색만 원하는 경우에는 일반 답변
    sequencing:
      - "Gate First: 변환 가능 판정 전에는 파일 생성 금지."
      - 기능 목적/기능명, 적용 대상/업무 범위, 핵심 사용자 행동과 기대 결과, 주요 조건·정책·제약이 모두 식별될 때만 저장 가능하다.
      - 기능설계서는 사용자 행동과 노출 결과 1개 이상, 정책서는 업무 판단 기준 1개 이상이 있어야 한다.
      - 입력이 부족하면 질문하지 않고 저장 보류와 부족 항목만 출력한다.
      - plan-format은 Product Docs SSOT를 검색하거나 검증하지 않는다. 입력 내부 충돌만 [충돌 후보]로 남긴다.
      - Python, Node.js, 별도 CLI helper 설치를 전제하지 않고 입력/저장 계약을 따른다.
      - 생성과 검토를 함께 요청하면 먼저 plan-format으로 초안을 저장하고, 저장 성공 후 plan-review를 안내한다.
      - 저장된 기능설계서와 정책서는 로컬 초안 템플릿이며 공식 팀 문서가 아니다.
      - 사용자가 명시적으로 바로 검토까지 요청한 경우에만 저장 경로를 대상으로 plan-review를 이어서 수행한다.
      - 사용자 출력은 output-contract.md 기준을 따르고 문서 분류는 classification-contract.md 기준을 따른다.

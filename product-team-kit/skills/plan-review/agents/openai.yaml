interface:
  display_name: plan-review
  short_description: 기능설계서/정책서 초안을 review-gate 기준으로 근거·범위·실행 가능성 관점에서 발행 전 검토합니다
  brand_color: "#0F766E"
  default_prompt: "다음 초안을 review-gate 기준으로 발행 전 검토해줘: <초안 폴더 또는 기능설계서/정책서 파일경로>"
policy:
  allow_implicit_invocation: true
  implicit_invocation:
    use_when:
      - 기존 기능설계서/정책서 초안 또는 초안 폴더를 검토해야 할 때
      - 발행 전 검토, review-gate 판단, pass/conditional pass/수정 필요 판정이 목적일 때
      - Project Docs SSOT 근거와 초안의 충돌, 누락, 실행 가능성을 확인해야 할 때
    avoid_when:
      - 질문하면서 기획 입력을 만들거나 모호함을 해소해야 하는 경우에는 plan-draft를 사용
      - 기획 입력을 기능설계서와 정책서 초안으로 생성해야 하는 경우에는 plan-format을 사용
      - 기능설계서/정책서 초안 경로가 아직 없고 생성과 검토를 함께 요청한 경우에는 plan-format을 먼저 사용
    sequencing:
      - pass 또는 conditional pass 결과에는 publish-readiness-contract 기준의 발행 준비 증적을 포함한다.
      - 수정 필요 결과에는 review-rerun-contract 기준의 수정 작업 블록을 포함한다.

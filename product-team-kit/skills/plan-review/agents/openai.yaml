interface:
  display_name: plan-review
  short_description: 기존 기능/화면설계서·정책서 초안을 Product Docs SSOT 기준으로 발행 전 검토합니다
  brand_color: "#0F766E"
  default_prompt: "다음 기존 기능/화면설계서·정책서 초안 또는 초안 폴더를 발행 전 검토해줘: <초안 폴더 또는 기능설계서/정책서 파일경로>"
policy:
  allow_implicit_invocation: true
  implicit_invocation:
    use_when:
      - 기존 기능설계서/정책서 초안 또는 초안 폴더를 검토해야 할 때
      - 발행 전 검토, 통과/조건부 통과/수정 필요 판정이 목적일 때
      - Product Docs SSOT 근거와 초안의 충돌, 누락, 용어 일관성을 확인해야 할 때
    avoid_when:
      - 기획 입력을 기능설계서와 정책서 초안으로 생성해야 하는 경우에는 plan-format을 사용
      - 기능설계서/정책서 초안 경로가 아직 없고 생성과 검토를 함께 요청한 경우에는 plan-format을 먼저 사용
    sequencing:
      - "점검 흐름: main이 dispatch와 A축 SSOT 충돌 점검을 직접 수행하고, B(용어 일관성)는 가능한 경우 worker로 분리한다. Codex 단일 패스 환경에서는 main이 A/B를 순차 점검한 뒤 merge한다. 세부는 SKILL.md '## 실행 단계' 참조."
      - 사람용 리포트에는 판정, 한 줄 결론, 먼저 할 일, 기준 문서 충돌을 먼저 보여준다.
      - 결과별 추가 블록과 상세 검토 기록은 output-format 기준으로 하단에 포함한다.
      - YAML manifest 블록은 사용하지 않고 사람용 markdown 체크리스트로 출력한다.
      - "output-format.md 템플릿을 감싼 ````text ... ```` 또는 ```text ... ``` fence는 docs 가독성용이다. 실제 출력에 fence 라인을 포함하지 않고 본문만 raw markdown으로 노출한다."
